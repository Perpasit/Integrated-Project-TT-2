version: '3.7'
services:

  api:
    container_name: api
    restart: always
    build:
      context: ./integrated-api
      dockerfile: Dockerfile
    environment:
      - SQLDBHOST=db
    ports:
      - "8080:8080"
    networks:
      - integrated-network

  db:
    build:
      context: ./integrated-db
      dockerfile: Dockerfile
    container_name: db
    restart: always
    networks:
      - integrated-network

  frontend:
    container_name: frontend
    build:
      context: ./integrated-frontend
      dockerfile: Dockerfile
    networks:
      - integrated-network

  proxy:
    container_name: proxy
    build:
      context: ./integrated-proxy
      dockerfile: Dockerfile
    restart: always
    ports:
      - "80:80"
      - "443:443"  
    volumes:
      - ./integrated-proxy/ssl:/etc/nginx/ssl  
    networks:
      - integrated-network

networks:
  integrated-network:
