version: '3.7'
services:

  api:
    container_name: api
    restart: always
    build:
      context: ./integrated-api
      dockerfile: Dockerfile
    environment:
      - SQLDBHOST=db
    ports:
      - "8080:8080"
    networks:
      - integrated-network

  db:
    build:
      context: ./integrated-db
      dockerfile: Dockerfile
    container_name: db
    restart: always
    # ports:
    #   - "33061:3306"
    networks:
      - integrated-network

  frontend:
    container_name: frontend
    build:
      context: ./integrated-frontend
      dockerfile: Dockerfile
    # ports:
    #   - "80:80"
    networks:
      - integrated-network

  proxy:
    container_name: integrated-proxy
    build:
      context: ./integrated-proxy
      dockerfile: Dockerfile
    restart: always
    ports:
      - "80:80"
    networks:
      - integrated-network


networks:
  integrated-network: